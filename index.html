<body>
<div class="app">
  <header class="topbar">
    <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="brand"><img src="./assets/logo.svg" alt="拾光"/><span class="brand-name">拾光</span><span class="brand-sep"></span><span class="workspace-name">个人图库</span></div>
    <label class="top-search"><svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.8" stroke="currentColor" stroke-width="1.5"/><path d="m13.2 13.2 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="search" placeholder="描述一张照片，或搜索图库…" autocomplete="off"/><span class="shortcut">⌘ K</span></label>
    <div class="top-spacer"></div><div class="sync"><span class="sync-dot"></span><span>示例图库 · 本地原型</span></div><button class="scan-button" id="scanBtn">扫描图库 <span>⌘ ↵</span></button>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-scroll">
        <div class="side-section"><div class="side-label">图库</div>
          <button class="nav-item" data-page="all"><svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="3.5" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="7.3" cy="8" r="1.3" fill="currentColor"/><path d="m4.5 14 3.6-3.3 2.2 2 2.1-1.7 3.1 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>所有照片<span class="nav-count">9</span></button>
          <button class="nav-item" data-page="recent"><svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.7" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v4.3l2.8 1.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>最近导入<span class="nav-count">9</span></button>
          <button class="nav-item" data-page="favorites"><svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="m10 2.8 2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7L10 2.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>收藏<span class="nav-count">2</span></button>
        </div>
        <div class="side-section"><div class="side-label">整理</div>
          <button class="nav-item" data-page="search"><svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.8" cy="8.8" r="5.8" stroke="currentColor" stroke-width="1.4"/><path d="m13.2 13.2 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.8 6.3v5M6.3 8.8h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>语义搜索</button>
          <button class="nav-item active" data-page="cleanup"><svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2.5 11.8 7l4.7 1.8-4.7 1.8L10 15l-1.8-4.4L3.5 8.8 8.2 7 10 2.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="m15.7 13.5.9 2.1 2 .8-2 .8-.9 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1Z" fill="currentColor"/></svg>清理建议<span class="nav-count" id="sideCount">9</span></button>
          <button class="nav-item" data-page="similar"><svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="10.5" height="11" rx="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M7 2.5h8.2a1.8 1.8 0 0 1 1.8 1.8v8.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="m4.5 12 2.6-2.6 1.8 1.7 1.3-1.2 2.1 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>相似照片<span class="nav-count">2 组</span></button>
          <button class="nav-item" data-page="queue"><svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M4 5.5h12M4 10h9M4 14.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="m13 13 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>待删除<span class="nav-count" id="queueSideCount">0</span></button>
        </div>
        <div class="side-section"><div class="side-label">我的规则</div>
          <button class="nav-item rule-nav active-rule" data-rule="blur"><span class="rule-dot"></span><span class="rule-name">严重模糊</span><span class="nav-count">6</span></button>
          <button class="nav-item rule-nav" data-rule="exposure"><span class="rule-dot mauve"></span><span class="rule-name">过暗 / 过曝</span><span class="nav-count">2</span></button>
          <button class="nav-item rule-nav" data-rule="blocked"><span class="rule-dot olive"></span><span class="rule-name">被遮挡 / 误拍</span><span class="nav-count">1</span></button>
          <button class="nav-item rule-nav" data-rule="eyes"><span class="rule-dot blue"></span><span class="rule-name">人物闭眼</span><span class="nav-count">0</span></button>
          <button class="add-rule" id="addRule">＋　创建扫描规则</button>
        </div>
      </div>
      <div class="side-bottom"><div class="source-row"><div class="phone-icon"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="5.2" y="2.3" width="9.6" height="15.4" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.7h4M9.2 15.2h1.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></div><div class="source-copy"><div class="source-title">示例照片图库</div><div class="source-status">演示数据 · 本机预览</div></div><button class="more-btn" aria-label="更多来源选项">···</button></div></div>
    </aside>

let activeRule="blur",activeTab="all",selected=new Set(),queue=0,activePage="cleanup",query="",descending=true;const $=s=>document.querySelector(s);const grid=$("#photoGrid");

function renderInspector(x){if(!x){$("#inspectorBody").innerHTML=`<div class="empty-state" style="padding:54px 12px"><div class="empty-icon"><svg viewBox="0 0 20 20" fill="none"><circle cx="8.8" cy="8.8" r="5.8" stroke="currentColor" stroke-width="1.3"/><path d="m13.2 13.2 4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div>当前规则没有候选照片</div>`;return}let t=x.type;let reason=x.reason;let rule=x.kind==="过暗"||x.kind==="过曝"?"曝光异常":x.kind==="遮挡"?"被遮挡 / 误拍":activeRule==="eyes"?"人物闭眼":"严重失焦、手抖模糊";$("#inspectorBody").innerHTML=`<div class="preview-wrap">${photoSvg(t,x.id+"large")}</div><div class="image-caption"><strong>${x.date}</strong><span>${x.size}</span></div><div class="detail-title">命中规则</div><div class="rule-hit"><div class="hit-top"><i class="hit-badge"></i>${rule}<span class="hit-score">${x.score}%</span></div><div class="hit-reason">${reason}</div></div><div class="score-label"><span>语义匹配度</span><strong>${(x.score/100).toFixed(2)}</strong></div><div class="score-track"><i style="width:${x.score}%"></i></div><div class="metadata"><span>拍摄时间</span><strong>2026年${x.date}</strong><span>相机</span><strong>示例设备</strong><span>分辨率</span><strong>${x.size} · 示例格式</strong><span>来源</span><strong>本地示例图库</strong></div><div class="inspector-actions"><button class="keep-btn" id="keepOne">✓　保留</button><button class="later-btn" id="laterOne">稍后复核</button></div>`;$("#keepOne").onclick=()=>{const item=scenes.find(y=>y.id===x.id);if(item)item.reviewed=true;selected.delete(x.id);toast("已标记为保留");render()};$("#laterOne").onclick=()=>{const item=scenes.find(y=>y.id===x.id);if(item)item.later=!item.later;toast(item?.later?"已移至稍后复核":"已从稍后复核移除");render()}}

$("#scanBtn").onclick=()=>{toast("正在扫描示例图库…（界面演示）");const btn=$("#scanBtn");btn.textContent="扫描中…";setTimeout(()=>{btn.innerHTML='扫描图库 <span>⌘ ↵</span>';toast("界面演示完成 · 模型接入后将运行真实扫描")},1000)};$("#refreshBtn").onclick=()=>{toast("正在演示重新扫描当前规则…");setTimeout(()=>toast("界面演示完成 · 当前候选保持不变"),850)};$("#addSelected").onclick=()=>{if(!selected.size){toast(activePage==="queue"?"先选择要移出的照片":"先选择要加入待删除的照片");return}const changed=selected.size;selected.forEach(id=>{const x=scenes.find(y=>y.id===id);if(!x)return;if(activePage==="queue"&&x.queued){x.queued=false;queue--}else if(activePage!=="queue"&&!x.queued){x.queued=true;queue++}});selected.clear();toast(activePage==="queue"?`已将 ${changed} 张照片移出待删除列表`:`已将 ${changed} 张照片加入待删除列表 · 可随时复核`);render()};$("#viewQueue").onclick=()=>{activePage="queue";document.querySelector('.nav-item[data-page="queue"]').click()};$("#loadMore").onclick=()=>toast("已显示当前原型中的全部示例照片");$("#dateFilter").onclick=()=>toast("筛选范围：最近 30 天（原型演示）");$("#sortFilter").onclick=()=>{descending=!descending;$("#sortFilter").innerHTML=(descending?"匹配度":"匹配度 · 升序")+' <svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';render()};$("#rulesBtn").onclick=()=>$("#ruleModal").classList.add("open");$("#addRule").onclick=()=>$("#ruleModal").classList.add("open");$("#cancelModal").onclick=()=>$("#ruleModal").classList.remove("open");$("#ruleModal").addEventListener("click",e=>{if(e.target===$("#ruleModal"))$("#ruleModal").classList.remove("open")});$("#saveRule").onclick=()=>{const name=$("#ruleName").value.trim(),prompt=$("#rulePrompt").value.trim();if(!name||!prompt){toast("请填写规则名称和查找描述");return}const b=document.createElement("button");b.className="nav-item rule-nav";b.dataset.rule="custom"+Date.now();b.innerHTML=`<span class="rule-dot blue"></span><span class="rule-name"></span><span class="nav-count">0</span>`;b.querySelector(".rule-name").textContent=name;document.querySelector(".side-section:nth-of-type(3)").insertBefore(b,$("#addRule"));$("#ruleModal").classList.remove("open");$("#ruleName").value="";$("#rulePrompt").value="";$("#ruleExclude").value="";b.onclick=()=>{activeRule=b.dataset.rule;activePage="cleanup";$("#pageTitle").textContent="清理建议";$("#crumb").textContent=name;document.querySelectorAll(".rule-nav").forEach(x=>x.classList.toggle("active-rule",x===b));$("#subheading").innerHTML="已保存规则 · <strong>演示原型暂不执行模型扫描</strong>";render()};activeRule=b.dataset.rule;activePage="cleanup";$("#pageTitle").textContent="清理建议";$("#crumb").textContent=name;$("#subheading").innerHTML="已保存规则 · <strong>演示原型暂不执行模型扫描</strong>";document.querySelectorAll(".rule-nav").forEach(x=>x.classList.toggle("active-rule",x===b));toast("规则已保存 · 演示原型暂不执行模型扫描");render()};$("#closeInspector").onclick=()=>toast("详情面板在完整应用中可收起");
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#search").focus()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="f"){e.preventDefault();$("#search").focus()}if((e.metaKey||e.ctrlKey)&&e.key==="Enter")$("#scanBtn").click();if(e.key==="Escape")$("#ruleModal").classList.remove("open");if(e.key===" "&&document.activeElement.tagName!=="INPUT"){const focused=scenes.find(x=>x.id===selectedFocus);if(focused){selected.has(focused.id)?selected.delete(focused.id):selected.add(focused.id);render();e.preventDefault()}}});
render();
