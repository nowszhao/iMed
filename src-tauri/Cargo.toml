[package]
name = "shiguang"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }
swift-rs = { version = "1.0.9", features = ["build"] }

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swift-rs = "1.0.9"
tauri = { version = "2.8", features = [] }
embeddinggemma_core = { git = "https://github.com/ikcore/ai-embeddinggemma-2", rev = "2369ca8eeebee30785b7a6eff1ab7968e5a56404", default-features = true, features = ["metal"] }

[patch.crates-io]
hf-hub = { path = "vendor/hf-hub" }

[profile.dev.package."*"]
opt-level = 2
